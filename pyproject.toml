[project]
name = "switchy-op"
version = "0.1.0"
description = "Remote robot operator: control protocol, gateway and client (prototype)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ui = ["pygame-ce>=2.5"]

[project.scripts]
switchy-op = "switchy_op.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.8",
    "types-pyyaml",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.per-file-target-version]
"tools/gazebo_bridge.py" = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

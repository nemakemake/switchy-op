# Run MediaMTX on the camera/gateway machine. Only RTSP is needed for this prototype.
# RTSP setup: TCP 8554; video to the Switch: UDP 8000/8001 on the server side.
logLevel: warn
rtsp: yes
rtspAddress: :8554
rtspTransports: [udp, tcp]
rtpAddress: :8000
rtcpAddress: :8001
rtmp: no
hls: no
webrtc: no
srt: no
paths:
  robot:
    source: publisher
